services:
  api:
    build:
      context: ./backend
    container_name: shopping-assistant-api
    ports:
      - "8000:8000"
    volumes:
      - shopping-db:/app/database
    environment:
      CORS_ORIGENS: "http://localhost:3001"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: shopping-assistant-web
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  shopping-db:
    driver: local
