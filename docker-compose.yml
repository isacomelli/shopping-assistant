services:
  api:
    build:
      context: ./backend
    container_name: shopping-assistant-api
    ports:
      - "8000:8000"
    volumes:
      - shopping-db:/app/data
    environment:
      CORS_ORIGENS: "http://localhost:3000"
      CAMINHO_BANCO: "/app/data/shopping.db"
      SERPER_API_KEY: "${SERPER_API_KEY:-}"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: shopping-assistant-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  shopping-db:
    driver: local
